[project]
name = "erp-shared-lib"
version = "0.1.0"
description = "Core lib for ERP System"
authors = [
    {name = "Владислав Сороковых",email = "black.walf16@gmail.com"}
]
packages = [{include = "erp_shared"}]
license = "MIT"
requires-python = ">=3.12, <4.0"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "bcrypt (>=5.0.0,<6.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.2,<0.17.0)"
]

[tool.ruff]
# Фиксируем версию Python для правильных подсказок
target-version = "py312"

exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pypackages__",
    "alembic",
    "migrations"
]

line-length = 120

[tool.ruff.lint]
select = [
    "E", # Стандартные ошибки PEP8 (pycodestyle)
    "F", # Логические ошибки, неиспользуемые переменные (Pyflakes)
    "I", # Автоматическая сортировка импортов (isort)
    "UP", # Автоматический апгрейд синтаксиса до Python 3.12 (pyupgrade)
    "B", # Поиск неочевидных багов, например, mutable defaults (flake8-bugbear)
    "C4", # Улучшение работы со списками и словарями (flake8-comprehensions)
    "SIM", # Советы по упрощению логики кода (flake8-simplify)
]

# Какие правила игнорировать (обычно это конфликтующие с форматтером вещи)
ignore = [
    "B008", # Разрешаем вызовы функций в аргументах
]

[tool.ruff.format]
# Настройки форматтера
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
# Группировка импортов, чтобы всё было красиво
known-first-party = ["erp_shared"] # Основной модуль будет отделен пустой строкой